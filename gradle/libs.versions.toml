[versions]
agp = "9.3.2"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
lifecycle = "2.9.4"
activityKtx = "1.11.0"
viewpager2 = "1.1.0"
recyclerview = "1.4.0"
constraintlayout = "2.2.1"
coil = "3.3.0"
coroutinesTest = "1.10.2"
# Kotlin/Android: AGP 9's built-in Kotlin support means we never declare/apply the separate
# org.jetbrains.kotlin.android plugin (see build.gradle.kts) — but the Compose *compiler* is a
# Kotlin compiler plugin, so it still needs a Kotlin Gradle Plugin version to hook into. This
# pins it to the same KGP release AGP 9.3.2 already brings onto the classpath under the hood.
kotlin = "2.2.10"
composeBom = "2026.08.00"
# Android: Hilt is Google's DI (dependency injection) framework built on top of Dagger — see
# .claude/lessons/12-2026-09-12-hilt-dependency-injection.md for the full walkthrough of what
# it replaces (the hand-written viewModelFactory { initializer { ... } } blocks) and why.
hilt = "2.59.2"
# Kotlin: KSP ("Kotlin Symbol Processing") is a compiler plugin API for code generation — Hilt
# uses it to generate the DI wiring code at build time instead of Dagger/Hilt doing reflection
# at runtime. Its version string is "<Kotlin version>-<KSP release>", so this must track
# whatever `kotlin` above is pinned to (2.2.10) — bumping one without the other breaks the build.
ksp = "2.2.10-2.0.2"
# Android: Navigation Compose — lets a single Activity host multiple composable "screens" and
# switch between them via a NavHost/NavController instead of each screen being its own Activity
# reached by an Intent. See .claude/lessons/07-2026-09-08-navigation.md for the full comparison.
navigationCompose = "2.9.7"
# Android: the bridge between Hilt and Compose ViewModels — it's what makes the
# `hiltViewModel()` composable function available, which scopes a @HiltViewModel to a single
# NavBackStackEntry instead of to a whole Activity (the old `by viewModels()` scope).
hiltLifecycleViewmodelCompose = "1.4.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityKtx" }
androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "viewpager2" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
coil-android = { group = "io.coil-kt.coil3", name = "coil-android", version.ref = "coil" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltLifecycleViewmodelCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Android: applied by every library module (core/* and feature/*) below `app` in the dependency
# graph — a library module produces an AAR to be consumed by another module, not an installable
# APK, so it has no applicationId/versionCode and can't be run directly.
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

