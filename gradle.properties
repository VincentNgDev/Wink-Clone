## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
#Mon Sep 07 22:27:27 GMT+08:00 2026
kotlin.code.style=official
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx1536M -Dkotlin.daemon.jvm.options\="-Xmx1024M" -Dfile.encoding\=UTF-8
# Android: AGP 9's "built-in Kotlin" support (see gradle/libs.versions.toml's `kotlin` comment)
# rejects the older `kotlin.sourceSets` API that KSP (used here for Hilt's code generation, see
# app/build.gradle.kts) still registers its generated-sources directory through as of this KSP
# release — https://github.com/google/ksp/issues/2729. This flag is the documented opt-back-in
# for that older API until KSP ships a fix that uses AGP 9's new `variant.sources` API instead;
# safe to remove once this project's KSP version picks that fix up.
android.disallowKotlinSourceSets=false
